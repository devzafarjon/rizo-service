[build]
  command = "npm ci && npm run build -w client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Set API_ORIGIN in the Netlify UI to the public API host, e.g. https://fsm-api.example.com
# so /api/* is proxied. Without it, sign-in cannot reach the Express server.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
