services:
  db:
    image: postgres:16-alpine
    container_name: fsm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fsm
      POSTGRES_PASSWORD: fsm
      POSTGRES_DB: fsm
    ports:
      - "5433:5432"
    volumes:
      - fsm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsm -d fsm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fsm_pgdata:
